name: sparkle-app-w
recipe: laravel
config:
  webroot: public
  php: '8.3'
  database: mysql:8.0
  cache: redis
  xdebug: false

services:
  pma:
    type: phpmyadmin
    hosts:
      - database
    portforward: 8082

tooling:
  artisan:
    service: appserver
    cmd: php artisan
  composer:
    service: appserver
    cmd: composer
  npm:
    service: appserver
    cmd: npm
