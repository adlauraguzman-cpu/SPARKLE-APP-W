name: sparkle-app-w
recipe: laravel
config:
  webroot: public
  php: '8.4'
  database: mysql:8.0
  cache: redis
  xdebug: false

services:
  appserver:
    overrides:
      environment:
        # En Lando la app usa MySQL; el archivo .env sigue con SQLite para localhost:8000
        APP_URL: https://sparkle-app-w.lndo.site
        DB_CONNECTION: mysql
        DB_HOST: database
        DB_PORT: '3306'
        DB_DATABASE: laravel
        DB_USERNAME: laravel
        DB_PASSWORD: laravel
  pma:
    type: phpmyadmin
    hosts:
      - database

proxy:
  pma:
    - pma.sparkle-app-w.lndo.site

tooling:
  artisan:
    service: appserver
    cmd: php artisan
  composer:
    service: appserver
    cmd: composer
  npm:
    service: appserver
    cmd: npm
